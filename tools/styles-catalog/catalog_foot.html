  </main>
</div>

<footer><div class="wrap">
  <div class="foot-brand">ADMKRS<span class="mk">·</span>SUITE</div>
  <div style="margin-top:8px">Ad-Style-Katalog · Previews: fiktive Marke „NOVA" in 9:16 · © 2026 ADMKRS GmbH, München · interner Gebrauch</div>
</div></footer>

<script>
const tabs=[...document.querySelectorAll('.tab')],q=document.getElementById('q'),count=document.getElementById('count');
const glinks=[...document.querySelectorAll('.g-link')];
let medium='all';
function apply(){
  const term=q.value.trim().toLowerCase();let vis=0;
  document.querySelectorAll('.grp').forEach(g=>{
    const mOk=medium==='all'||g.dataset.medium===medium;let inGrp=0;
    g.querySelectorAll('.card').forEach(c=>{
      const ok=mOk&&(!term||c.dataset.q.includes(term));
      c.classList.toggle('hide',!ok);if(ok){inGrp++;vis++}
    });
    g.classList.toggle('hide',inGrp===0);
    const gl=glinks.find(l=>l.getAttribute('href')==='#'+g.id);
    if(gl)gl.classList.toggle('hide',inGrp===0);
  });
  count.textContent=vis+' / 184 Styles';
}
tabs.forEach(t=>t.addEventListener('click',()=>{tabs.forEach(x=>x.classList.toggle('on',x===t));medium=t.dataset.m;apply()}));
q.addEventListener('input',apply);
apply();

// Previews animieren nur im Viewport (Performance bei 184 Szenen)
const io=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('play',e.isIntersecting)),{rootMargin:'80px 0px'});
document.querySelectorAll('.pv.anim').forEach(p=>io.observe(p));

// Scrollspy: aktive Kategorie in der Sidebar markieren
const spy=new IntersectionObserver(es=>{
  es.forEach(e=>{if(e.isIntersecting){
    glinks.forEach(l=>l.classList.toggle('active',l.getAttribute('href')==='#'+e.target.id));
  }});
},{rootMargin:'-15% 0px -75% 0px'});
document.querySelectorAll('.grp').forEach(g=>spy.observe(g));
</script>
</body>
</html>
