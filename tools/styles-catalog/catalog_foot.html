  </main>
</div>

<footer><div class="wrap">
  <div class="foot-brand">ADMKRS<span class="mk">·</span>SUITE</div>
  <div style="margin-top:8px">Ad-Style-Katalog · {{FAMS}} Familien · {{TOTAL}} Styles · Previews: fiktive Marke „NOVA" in 9:16 · © 2026 ADMKRS GmbH, München · interner Gebrauch</div>
</div></footer>

<script>
const tabs=[...document.querySelectorAll('.tab')],q=document.getElementById('q'),count=document.getElementById('count');
const fams=[...document.querySelectorAll('.fam')];
const glinks=[...document.querySelectorAll('.g-link')];
let medium='all';

function setOpen(f,open){
  f.classList.toggle('open',open);
  const h=f.querySelector('.fam-head');if(h)h.setAttribute('aria-expanded',open?'true':'false');
}
fams.forEach(f=>{
  const h=f.querySelector('.fam-head');
  h.addEventListener('click',()=>setOpen(f,!f.classList.contains('open')));
  h.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setOpen(f,!f.classList.contains('open'))}});
});

function apply(fromSearch){
  const term=q.value.trim().toLowerCase();let vis=0;
  fams.forEach(f=>{
    const mOk=medium==='all'||f.dataset.medium===medium;let inFam=0;
    f.querySelectorAll('.card').forEach(c=>{
      const ok=mOk&&(!term||c.dataset.q.includes(term));
      c.classList.toggle('hide',!ok);if(ok){inFam++;vis++}
    });
    f.classList.toggle('hide',inFam===0);
    if(term&&fromSearch)setOpen(f,inFam>0);
    const gl=glinks.find(l=>l.getAttribute('href')==='#'+f.id);
    if(gl)gl.classList.toggle('hide',inFam===0);
    const cnt=f.querySelector('.fam-cnt');
    if(cnt)cnt.textContent=(term||medium!=='all')?inFam+' Treffer':cnt.dataset.full;
  });
  document.querySelectorAll('.med-h').forEach(h=>{
    let el=h.nextElementSibling,any=false;
    while(el&&!el.classList.contains('med-h')){if(el.classList.contains('fam')&&!el.classList.contains('hide'))any=true;el=el.nextElementSibling}
    h.classList.toggle('hide',!any);
  });
  count.textContent=vis+' / {{TOTAL}} Styles';
}
document.querySelectorAll('.fam-cnt').forEach(c=>c.dataset.full=c.textContent);
tabs.forEach(t=>t.addEventListener('click',()=>{tabs.forEach(x=>x.classList.toggle('on',x===t));medium=t.dataset.m;apply(false)}));
q.addEventListener('input',()=>apply(true));
apply(false);

// Sidebar-Klick: Familie aufklappen + hinscrollen
glinks.forEach(l=>l.addEventListener('click',()=>{
  const f=document.querySelector(l.getAttribute('href'));
  if(f)setOpen(f,true);
}));

// Previews animieren nur im Viewport (Performance)
const io=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('play',e.isIntersecting)),{rootMargin:'80px 0px'});
document.querySelectorAll('.pv.anim').forEach(p=>io.observe(p));

// Scrollspy: aktive Familie in der Sidebar markieren
const spy=new IntersectionObserver(es=>{
  es.forEach(e=>{if(e.isIntersecting){
    glinks.forEach(l=>l.classList.toggle('active',l.getAttribute('href')==='#'+e.target.id));
  }});
},{rootMargin:'-10% 0px -70% 0px'});
fams.forEach(f=>spy.observe(f));
</script>
</body>
</html>
